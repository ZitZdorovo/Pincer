appId: app.pincer.desktop
productName: Pincer
asar: true
afterPack: scripts/after-pack.cjs
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - assets/icon.png
  - package.json
  - LICENSE
  - docs/licenses/**/*
win:
  icon: build/icon.ico
  signAndEditExecutable: false
  target:
    - target: nsis
      arch: [x64]
  artifactName: Pincer-Setup-${version}-${arch}.${ext}
mac:
  icon: assets/icon.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  artifactName: Pincer-${version}-mac-${arch}.${ext}
linux:
  icon: assets/icon.png
  category: Development
  target:
    - target: AppImage
      arch: [x64]
  artifactName: Pincer-${version}-linux-${arch}.${ext}
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
publish:
  provider: github
  owner: ZitZdorovo
  repo: Pincer
  releaseType: release
