appId: app.pincer.desktop
productName: Pincer
asar: true
afterPack: scripts/after-pack.cjs
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - assets/icon.png
  - package.json
  - LICENSE
  - docs/licenses/**/*
win:
  icon: build/icon.ico
  signAndEditExecutable: false
  target:
    - target: nsis
      arch: [x64]
  artifactName: Pincer-Setup-${version}-${arch}.${ext}
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
publish:
  provider: github
  owner: ZitZdorovo
  repo: Pincer
  releaseType: release
releaseInfo:
  releaseNotesFile: RELEASE_NOTES.md
