name: Проверка Pincer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pincer-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Тесты Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить типы
        run: npm run typecheck

      - name: Запустить модульные и интеграционные тесты
        run: npm test

      - name: Собрать приложение для Electron E2E
        run: npm run build

      - name: Запустить Electron E2E
        run: npx playwright test

      - name: Сохранить отчёт при ошибке интерфейсных тестов
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Pincer-test-results-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            test-results/**
            playwright-report/**
