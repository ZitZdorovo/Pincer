name: Release Pincer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Существующий тег вида v0.5.1'
        required: true
        type: string
concurrency:
  group: pincer-release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  windows:
    name: Проверка и публикация Windows-релиза
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - name: Verify release version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { $env:GITHUB_REF_NAME }
          if ($tag -ne "v$version") { throw "Tag $tag and package version $version differ" }

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright test
      - run: npm run package:win:publish
      - run: npm run verify:installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
